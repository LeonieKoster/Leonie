# 04 — Mijn digital garden

In mijn digital garden wil ik verschillende kanten van Never Enough onderzoeken. Niet alleen de negatieve kant, maar ook waarom we zo graag willen groeien, verbeteren en nieuwe dingen ervaren.

Het uitgangspunt is de vraag: waarom is genoeg voor ons vaak niet genoeg? Dit zie je op veel manieren terug in het dagelijks leven. We willen steeds meer, beter, mooier of interessanter.

Ik wil daarom geen standaard informatieve website maken, maar een website die bezoekers laat nadenken over hun eigen gedrag. De onderwerpen verdeel ik in Our Minds, Our Bodies, Online en Our Lives. Denk hierbij aan FOMO, overthinking, Just One More, glow-up culture, productiviteit en Let’s Romanticize Life.
Wat ik interessant vind aan andere websites is wanneer informatie niet meteen volledig wordt gegeven, maar je als bezoeker zelf iets ontdekt. Ik wil daarom experimenteren met scroll-interacties, verborgen informatie, bewegende elementen en verschillende lagen binnen een pagina. Vooral scroll-based animations, interactieve hover states en animaties die reageren op de gebruiker lijken mij interessant om verder te onderzoeken.
